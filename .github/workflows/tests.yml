# The kit's own dogfooded gate: the runnable example's 22-test battery
# (FR-1..3 / SR-1..6 / EV-1..4) runs on every push and PR — the same
# "evals in CI" doctrine the framework prescribes in docs/en/02 §5 (Play 9).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-battery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/money-web-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/money-web-app/app/package-lock.json

      - run: npm ci

      - name: Run gate battery (22 tests)
        run: npm test

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scaffold a project and verify its wiring (round-trip)
        run: |
          node cli/ai-sdlc-kit.mjs init /tmp/proj --skills intent-review --agent claude
          node cli/ai-sdlc-kit.mjs check /tmp/proj
      - name: Bilingual help (--lang vi)
        run: node cli/ai-sdlc-kit.mjs --help --lang vi | grep -q "dựng khung"
      - name: update round-trip (skip preserves project edits; force overwrites; converges)
        run: |
          node cli/ai-sdlc-kit.mjs update /tmp/proj | grep -q "0 skipped"
          echo "# custom" >> /tmp/proj/policy/quality-gates.yml
          node cli/ai-sdlc-kit.mjs update /tmp/proj | grep -q "1 skipped"
          node cli/ai-sdlc-kit.mjs update /tmp/proj | grep -q "1 skipped"
          grep -q "# custom" /tmp/proj/policy/quality-gates.yml
          node cli/ai-sdlc-kit.mjs update /tmp/proj --force | grep -q "1 updated"
          node cli/ai-sdlc-kit.mjs update /tmp/proj | grep -q "0 skipped"
      - name: install.sh round-trip (mirrors CLI rules)
        run: |
          bash skills/install.sh spec-review /tmp/proj --agent claude
          test -f /tmp/proj/.claude/skills/spec-review/SKILL.md
          grep -q "skills:auto:start" /tmp/proj/AGENTS.md
      - name: Unknown pack must fail before writing anything
        run: |
          ! node cli/ai-sdlc-kit.mjs init /tmp/nope --skills does-not-exist
          test ! -d /tmp/nope
      - name: One release number; plugin is SHA-tracked (no pinned version)
        run: |
          V=$(node cli/ai-sdlc-kit.mjs --version)
          test "$V" = "$(node -p 'require("./package.json").version')"
          node -e 'const p = require("./.claude-plugin/plugin.json"); if ("version" in p) { console.error("plugin.json must not pin version: Claude Code would then track the release, not commits"); process.exit(1); }'
          node -e 'require("./hooks/hooks.json")'
      - name: Plugin-mode init copies no local skills and namespaces routing
        run: |
          rm -rf /tmp/plug
          node cli/ai-sdlc-kit.mjs init /tmp/plug --skills intent-review,spec-review --agent claude --plugin
          test ! -e /tmp/plug/.claude/skills/intent-review
          test ! -e /tmp/plug/.claude/skills/spec-review
          grep -q "| ai-sdlc-kit:intent-review |" /tmp/plug/AGENTS.md
          node cli/ai-sdlc-kit.mjs update /tmp/plug | grep -q "done:"
          test ! -e /tmp/plug/.claude/skills/intent-review
          node cli/ai-sdlc-kit.mjs check /tmp/plug | grep -q "plugin mode"
      - name: skill command keeps the routing rows of packs already installed
        run: |
          rm -rf /tmp/rt
          node cli/ai-sdlc-kit.mjs init /tmp/rt --skills intent-review --agent claude
          node cli/ai-sdlc-kit.mjs skill spec-review /tmp/rt --agent claude
          grep -q "^| intent-review |" /tmp/rt/AGENTS.md
          grep -q "^| spec-review |" /tmp/rt/AGENTS.md
      - name: Every agent gets its skill directory and an explicit routing path
        run: |
          for pair in claude:.claude/skills cursor:.cursor/skills codex:.agents/skills zcode:.zcode/skills gemini:.gemini/skills copilot:.github/skills; do
            a=${pair%%:*}; d=${pair#*:}
            rm -rf /tmp/ag-$a
            node cli/ai-sdlc-kit.mjs init /tmp/ag-$a --skills intent-review,spec-review --agent $a
            test -f /tmp/ag-$a/$d/intent-review/SKILL.md
            grep -qF "$d/<pack>/SKILL.md" /tmp/ag-$a/AGENTS.md
            bash skills/install.sh spec-review /tmp/ag-$a --agent $a
            test -f /tmp/ag-$a/$d/spec-review/SKILL.md
            grep -qF "$d/<pack>/SKILL.md" /tmp/ag-$a/AGENTS.md
            node cli/ai-sdlc-kit.mjs check /tmp/ag-$a | grep -q "wiring checks pass"
          done
      - name: install.sh and the CLI produce identical projects
        run: |
          rm -rf /tmp/par-cli /tmp/par-sh
          node cli/ai-sdlc-kit.mjs init /tmp/par-cli --skills intent-review --agent gemini >/dev/null
          node cli/ai-sdlc-kit.mjs init /tmp/par-sh --skills intent-review --agent gemini >/dev/null
          node cli/ai-sdlc-kit.mjs skill spec-review /tmp/par-cli --agent gemini >/dev/null
          bash skills/install.sh spec-review /tmp/par-sh --agent gemini >/dev/null
          diff -r -x .ai-sdlc-kit.json /tmp/par-cli /tmp/par-sh
      - name: Routing lists packs found on disk even without a manifest
        run: |
          rm -rf /tmp/nomani
          node cli/ai-sdlc-kit.mjs init /tmp/nomani --skills intent-review --agent cursor >/dev/null
          rm /tmp/nomani/.ai-sdlc-kit.json
          bash skills/install.sh spec-review /tmp/nomani --agent cursor >/dev/null
          grep -q "^| intent-review |" /tmp/nomani/AGENTS.md
          grep -q "^| spec-review |" /tmp/nomani/AGENTS.md
      - name: Gemini reads AGENTS.md through a GEMINI.md import
        run: |
          grep -qx "@AGENTS.md" /tmp/ag-gemini/GEMINI.md
          echo "# gemini notes" > /tmp/ag-gemini/GEMINI.md
          node cli/ai-sdlc-kit.mjs check /tmp/ag-gemini | grep -q "ignores AGENTS.md"
          node cli/ai-sdlc-kit.mjs skill spec-review /tmp/ag-gemini --agent gemini >/dev/null
          grep -qx "@AGENTS.md" /tmp/ag-gemini/GEMINI.md
      - name: A CLAUDE.md that hides AGENTS.md is flagged by check
        run: |
          echo "# my notes" > /tmp/ag-claude/CLAUDE.md
          node cli/ai-sdlc-kit.mjs check /tmp/ag-claude | grep -q "ignores AGENTS.md"
          echo "@AGENTS.md" >> /tmp/ag-claude/CLAUDE.md
          ! node cli/ai-sdlc-kit.mjs check /tmp/ag-claude | grep -q "ignores AGENTS.md"
      - name: notify is silent unless the project is behind the kit release
        run: |
          test -z "$(node cli/ai-sdlc-kit.mjs notify /tmp/rt)"
          test -z "$(node cli/ai-sdlc-kit.mjs notify /tmp/does-not-exist)"
          node -e 'const f = "/tmp/rt/.ai-sdlc-kit.json"; const m = require(f); m.kitVersion = "1.6.0"; require("fs").writeFileSync(f, JSON.stringify(m));'
          node cli/ai-sdlc-kit.mjs notify /tmp/rt | node -e 'const o = JSON.parse(require("fs").readFileSync(0, "utf8")); if (!o.systemMessage || !o.hookSpecificOutput.additionalContext) process.exit(1);'
      - name: /ai-sdlc-kit:init command — dry run previews plugin mode and writes nothing
        run: |
          rm -rf /tmp/cmd-init
          node cli/ai-sdlc-kit.mjs init /tmp/cmd-init --agent claude --plugin --dry-run | grep -q "skill (plugin)   intent-review"
          test ! -e /tmp/cmd-init
          test -f commands/init.md
          grep -q "^disable-model-invocation: true$" commands/init.md
          grep -q -- "--dry-run" commands/init.md
          grep -q -- "--plugin" commands/init.md
