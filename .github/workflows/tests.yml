# The kit's own dogfooded gate: the runnable example's 22-test battery
# (FR-1..3 / SR-1..6 / EV-1..4) runs on every push and PR — the same
# "evals in CI" doctrine the framework prescribes in docs/en/02 §5 (Play 9).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-battery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/money-web-app/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/money-web-app/app/package-lock.json

      - run: npm ci

      - name: Run gate battery (22 tests)
        run: npm test

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scaffold a project and verify its wiring (round-trip)
        run: |
          node cli/ai-sdlc-kit.mjs init /tmp/proj --skills intent-review
          node cli/ai-sdlc-kit.mjs check /tmp/proj
      - name: Bilingual help (--lang vi)
        run: node cli/ai-sdlc-kit.mjs --help --lang vi | grep -q "dựng khung"
      - name: install.sh round-trip (mirrors CLI rules)
        run: |
          bash skills/install.sh spec-review /tmp/proj --ai claude
          test -f /tmp/proj/.claude/skills/spec-review/SKILL.md
          grep -q "skills:auto:start" /tmp/proj/AGENTS.md
      - name: Unknown pack must fail before writing anything
        run: |
          ! node cli/ai-sdlc-kit.mjs init /tmp/nope --skills does-not-exist
          test ! -d /tmp/nope
